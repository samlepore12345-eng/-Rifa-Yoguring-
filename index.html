<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUINIENTAZO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #0f0; font-family: Arial, sans-serif; }
    .hidden { display: none !important; }
    .pin { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; }
    h1 { color: #ffd700; font-size: 48px; text-align: center; }
    h2 { color: #ffd700; font-size: 28px; margin: 20px 0; }
    input { padding: 12px; background: #1a1a1a; border: 2px solid #0f0; color: #0f0; border-radius: 4px; width: 250px; font-size: 14px; }
    button { padding: 12px 24px; background: #ffd700; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 14px; margin: 5px; }
    button:hover { background: #ffed4e; }
    .admin { background: #000; padding: 30px; max-width: 1000px; margin: 0 auto; }
    .box { background: #1a1a1a; border: 2px solid #0f0; padding: 15px; margin: 15px 0; border-radius: 4px; }
    label { display: block; color: #0f0; font-size: 12px; margin-bottom: 8px; font-weight: bold; }
    input.full { width: 100%; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px 0; }
    .gridBtn { padding: 10px; background: #1a1a1a; border: 2px solid #0f0; color: #0f0; font-size: 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .gridBtn:disabled { background: #666; color: #999; opacity: 0.5; cursor: not-allowed; }
    .gridBtn.selected { background: #0f0; color: #000; }
    .public { background: #000; padding: 20px; min-height: 100vh; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
    .stat-box { background: #1a1a1a; border: 2px solid #0f0; padding: 20px; border-radius: 4px; text-align: center; }
    .stat-box h3 { color: #ffd700; font-size: 24px; }
    .stat-box p { color: #0f0; margin: 10px 0; }
    .nav { display: flex; justify-content: space-between; margin: 20px 0; }
    img.foto { max-width: 100%; max-height: 250px; border: 2px solid #0f0; border-radius: 4px; margin: 10px 0; }
    .fotoPreview { max-width: 100%; max-height: 200px; border: 2px solid #0f0; margin: 10px 0; display: none; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
    .modal.show { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: #1a1a1a; border: 2px solid #0f0; padding: 30px; border-radius: 8px; max-width: 500px; text-align: center; color: #0f0; }
    .modal-content input { margin: 10px 0; width: 100%; }
    .ticket { background: #0f0; color: #000; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: left; font-weight: bold; }
  </style>
</head>
<body>

<div id="pin" class="pin">
  <h1>🔐 QUINIENTAZO</h1>
  <input type="password" id="pinInput" placeholder="PIN" onkeypress="if(event.key=='Enter') login()">
  <button onclick="login()">ENTRAR</button>
  <button onclick="goPublic()">Ver Pública</button>
</div>

<div id="admin" class="admin hidden">
  <div class="nav">
    <h1>⚙️ ADMIN</h1>
    <button onclick="logout()" style="background:#ff3333">← Salir</button>
  </div>

  <div class="box">
    <label>📷 Foto (Cámara):</label>
    <button onclick="tomarFoto()">📷 Cámara</button>
    <button onclick="limpiarFoto()" style="background:#ff3333">Limpiar</button>
  </div>

  <div class="box">
    <label>🔗 URL Foto:</label>
    <input type="text" id="urlFoto" class="full" placeholder="https://...">
    <button onclick="cargarURL()">Cargar URL</button>
  </div>

  <div class="box">
    <img id="fotoPreview" class="fotoPreview">
  </div>

  <div class="box">
    <label>Chontico Noche:</label>
    <input type="text" id="chontico" class="full" maxlength="4" oninput="guardar()">
  </div>

  <div class="box">
    <label>Ganador:</label>
    <input type="text" id="ganador" class="full" oninput="guardar()">
  </div>

  <div class="box">
    <label>Puestos Vendidos:</label>
    <p id="porcentaje" style="color:#ffd700; font-size:20px;">0%</p>
  </div>

  <div class="box">
    <button onclick="limpiarTodo()" style="background:#ff3333; width: 100%;">🗑️ RESETEAR RIFA</button>
  </div>
</div>

<div id="public" class="public hidden">
  <div class="nav">
    <h1>🦅 QUINIENTAZO</h1>
    <button onclick="goBack()" style="background:#ffd700">← Atrás</button>
  </div>

  <div style="text-align:center;">
    <img id="fotoPublica" class="foto" style="display:none;">
  </div>

  <div class="stats">
    <div class="stat-box">
      <h3>Puestos</h3>
      <p id="pubVendidos">0</p>
      <p id="pubPorcentaje">0%</p>
    </div>
    <div class="stat-box">
      <h3>Chontico</h3>
      <p id="pubChontico">-</p>
    </div>
  </div>

  <h2>Elige tus Números</h2>
  <div class="grid" id="grid"></div>
</div>

<div id="modal" class="modal">
  <div class="modal-content">
    <h2>📦 COMPRA RIFA</h2>
    <p id="modalNumeros" style="font-size: 18px; margin: 10px 0; color: #ffd700;"></p>
    <label>Tu nombre:</label>
    <input type="text" id="modalNombre" placeholder="Nombre completo">
    <label>Tu WhatsApp:</label>
    <input type="text" id="modalWp" placeholder="Número">
    <button onclick="confirmarCompra()">✓ CONFIRMAR</button>
    <button onclick="cancelarCompra()" style="background:#ff3333">✕ CANCELAR</button>
  </div>
</div>

<script>
const PIN = '8682';
let datos = { chontico: '', ganador: '', foto: '' };
let puestos = Array(50).fill(false);
let numeros = [];
let tickets = [];

function guardar() {
  datos.chontico = document.getElementById('chontico').value;
  datos.ganador = document.getElementById('ganador').value;
  localStorage.setItem('quinientazo', JSON.stringify(datos));
  localStorage.setItem('puestos', JSON.stringify(puestos));
  localStorage.setItem('tickets', JSON.stringify(tickets));
}

function cargar() {
  const saved = localStorage.getItem('quinientazo');
  if (saved) datos = JSON.parse(saved);
  const savedPuestos = localStorage.getItem('puestos');
  if (savedPuestos) puestos = JSON.parse(savedPuestos);
  const savedTickets = localStorage.getItem('tickets');
  if (savedTickets) tickets = JSON.parse(savedTickets);
}

function tomarFoto() {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      const video = document.createElement('video');
      video.srcObject = stream;
      video.play();
      const btn = document.createElement('button');
      btn.textContent = 'Capturar';
      btn.style.padding = '20px';
      document.body.appendChild(btn);
      btn.onclick = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        datos.foto = canvas.toDataURL('image/jpeg');
        guardar();
        document.getElementById('fotoPreview').src = datos.foto;
        document.getElementById('fotoPreview').style.display = 'block';
        stream.getTracks().forEach(t => t.stop());
        btn.remove();
        alert('Foto capturada');
      };
    })
    .catch(e => alert('Error cámara: ' + e.message));
}

function cargarURL() {
  const url = document.getElementById('urlFoto').value.trim();
  if (url) {
    datos.foto = url;
    guardar();
    document.getElementById('fotoPreview').src = url;
    document.getElementById('fotoPreview').style.display = 'block';
    alert('URL guardada');
  }
}

function limpiarFoto() {
  datos.foto = '';
  document.getElementById('urlFoto').value = '';
  document.getElementById('fotoPreview').style.display = 'none';
  guardar();
}

function limpiarTodo() {
  if (confirm('¿RESETEAR TODA LA RIFA?')) {
    puestos = Array(50).fill(false);
    datos = { chontico: '', ganador: '', foto: '' };
    tickets = [];
    guardar();
    location.reload();
  }
}

function login() {
  if (document.getElementById('pinInput').value === PIN) {
    document.getElementById('pin').classList.add('hidden');
    document.getElementById('admin').classList.remove('hidden');
    cargar();
    document.getElementById('chontico').value = datos.chontico;
    document.getElementById('ganador').value = datos.ganador;
    if (datos.foto) {
      document.getElementById('fotoPreview').src = datos.foto;
      document.getElementById('fotoPreview').style.display = 'block';
    }
    document.getElementById('porcentaje').textContent = Math.round((puestos.filter(p => p).length / 50) * 100) + '%';
  } else {
    alert('PIN incorrecto');
  }
}

function logout() {
  document.getElementById('admin').classList.add('hidden');
  document.getElementById('pin').classList.remove('hidden');
  document.getElementById('pinInput').value = '';
}

function goPublic() {
  document.getElementById('pin').classList.add('hidden');
  document.getElementById('public').classList.remove('hidden');
  cargar();
  if (datos.foto) {
    document.getElementById('fotoPublica').src = datos.foto;
    document.getElementById('fotoPublica').style.display = 'block';
  }
  construirGrilla();
}

function goBack() {
  document.getElementById('public').classList.add('hidden');
  document.getElementById('pin').classList.remove('hidden');
}

function construirGrilla() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < 50; i++) {
    const btn = document.createElement('button');
    btn.className = 'gridBtn';
    btn.textContent = String(i * 2).padStart(2, '0') + '-' + String(i * 2 + 1).padStart(2, '0');
    if (puestos[i]) {
      btn.disabled = true;
    } else {
      btn.onclick = () => seleccionar(i, btn);
    }
    grid.appendChild(btn);
  }
  document.getElementById('pubVendidos').textContent = puestos.filter(p => p).length;
  document.getElementById('pubPorcentaje').textContent = Math.round((puestos.filter(p => p).length / 50) * 100) + '%';
  document.getElementById('pubChontico').textContent = datos.chontico || '-';
}

function seleccionar(idx, btn) {
  if (numeros.includes(idx)) {
    numeros = numeros.filter(i => i !== idx);
    btn.classList.remove('selected');
  } else {
    numeros.push(idx);
    btn.classList.add('selected');
  }
}

function confirmarCompra() {
  const nombre = document.getElementById('modalNombre').value.trim();
  const wp = document.getElementById('modalWp').value.trim();
  
  if (!nombre || !wp) {
    alert('Completa todos los campos');
    return;
  }

  if (wp.length < 10) {
    alert('WhatsApp inválido');
    return;
  }

  const numerosTexto = numeros.map(i => `${String(i * 2).padStart(2, '0')}-${String(i * 2 + 1).padStart(2, '0')}`).join(', ');
  
  numeros.forEach(i => {
    puestos[i] = true;
  });

  const ticket = {
    fecha: new Date().toLocaleString('es-CO'),
    nombre: nombre,
    whatsapp: wp,
    numeros: numerosTexto,
    cantidad: numeros.length
  };

  tickets.push(ticket);
  guardar();

  const ticketTexto = `🎫 TICKET QUINIENTAZO\n\n👤 ${nombre}\n📱 ${wp}\n🎯 Números: ${numerosTexto}\n📅 ${ticket.fecha}`;
  
  alert(`✅ COMPRA CONFIRMADA\n\n${ticketTexto}`);
  
  cancelarCompra();
  construirGrilla();
  document.getElementById('porcentaje').textContent = Math.round((puestos.filter(p => p).length / 50) * 100) + '%';
}

function cancelarCompra() {
  numeros = [];
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modalNombre').value = '';
  document.getElementById('modalWp').value = '';
  document.querySelectorAll('.gridBtn.selected').forEach(b => b.classList.remove('selected'));
}

// Cuando cliente selecciona números, muestra modal
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('gridBtn') && numeros.length > 0 && document.getElementById('public').classList.contains('hidden') === false) {
    const numerosTexto = numeros.map(i => `${String(i * 2).padStart(2, '0')}-${String(i * 2 + 1).padStart(2, '0')}`).join(', ');
    document.getElementById('modalNumeros').textContent = `Números: ${numerosTexto}`;
    document.getElementById('modal').classList.add('show');
  }
});

cargar();
</script>

</body>
</html>
