<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎟️ Quinientazo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0d0d1a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    .container { max-width: 500px; width: 100%; }
    .pantalla { display: none; }
    .pantalla.activa { display: block; }
    h1 { text-align: center; color: #ffcc00; font-size: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .logo-img { height: 50px; }
    .articulo-img { max-width: 100%; border-radius: 10px; margin: 10px 0; }
    .info { text-align: center; margin: 10px 0; font-size: 14px; color: #aaa; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 15px 0; width: 100%; }
    .puesto { background: #1a1a2e; padding: 6px 2px; text-align: center; border-radius: 6px; cursor: pointer; border: 2px solid #00f5ff; font-weight: bold; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-height: 30px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
    .puesto:hover { transform: scale(1.05); }
    .puesto.seleccionado { border-color: #ffcc00; background: #2a2a4e; }
    .puesto.reservado { border-color: #ff0040; background: #3a1a2e; cursor: not-allowed; opacity: 0.6; }
    .datos input { width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px; border: none; background: #1a1a2e; color: #fff; box-sizing: border-box; }
    .btn { padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; box-sizing: border-box; }
    .btn-reservar { background: #00f5ff; color: #000; }
    .btn-reservar:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-volver { background: #555; color: #fff; margin-top: 5px; }
    .btn-ir { background: #00f5ff; color: #000; }
    .total { text-align: center; font-size: 16px; margin: 10px 0; }
  </style>
</head>
<body>
<div class="container">

  <!-- ========== PANTALLA 1: INICIO ========== -->
  <div class="pantalla activa" id="pantalla1">
    <h1 id="titulo">🏆 QUINIENTAZO</h1>
    <p id="info" class="info"></p>
    <div id="articuloContainer"></div>
    <button class="btn btn-ir" id="btnIrGrilla">📋 VER GRILLA Y RESERVAR</button>
  </div>

  <!-- ========== PANTALLA 2: GRILLA ========== -->
  <div class="pantalla" id="pantalla2">
    <div class="datos">
      <input type="text" id="nombre" placeholder="👤 Nombre completo" />
      <input type="text" id="telefono" placeholder="📱 Teléfono (ej: 3019679760)" />
    </div>
    <div class="grid" id="grid"></div>
    <div class="total">Seleccionados: <span id="contador">0</span> | Total: $<span id="total">0</span></div>
    <button class="btn btn-reservar" id="btnReservar" disabled>📲 RESERVAR Y ENVIAR TICKETS</button>
    <button class="btn btn-volver" id="btnVolverInicio">⬆️ VOLVER AL INICIO</button>
  </div>

</div>

<script>
const CONFIG = {
    titulo: "🏆 yogurinazo",
    rifa: "CHONTICO",
    premio: "un paquete de yogurin de 47 unidades",
    precio: 0,
    articulo: "BOLI YOGURT P47",
    descripcion: "Paquete de 47 unidades",
    imagenArticulo: "https://i.ibb.co/GQzBcP4R/tu-imagen.jpg",  // https://ibb.co/GfW9GJBJ
    logo: "https://i.ibb.co/84xs8v9D/tu-logo.jpg",            // https://ibb.co/GQzBcP4R
    fontSize: "11px",
    totalPuestos: 50,
    admin: "3019679760"
};

const ADMIN = CONFIG.admin;
const TOTAL_PUESTOS = CONFIG.totalPuestos;
const PRECIO = CONFIG.precio;

let puestos = [];
let seleccionados = [];

function mostrarPantalla(id) {
    document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
    document.getElementById(id).classList.add('activa');
}

function initPuestos() {
    puestos = [];
    for (let i = 0; i < TOTAL_PUESTOS; i++) {
        const num1 = i * 2;
        const num2 = i * 2 + 1;
        puestos.push({
            id: i,
            label: String(num1).padStart(2, '0') + '-' + String(num2).padStart(2, '0'),
            reservado: false,
            comprador: null
        });
    }
}

function renderGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    puestos.forEach((p, idx) => {
        const div = document.createElement('div');
        div.className = 'puesto';
        div.style.fontSize = CONFIG.fontSize;
        if (p.reservado) div.classList.add('reservado');
        if (seleccionados.includes(idx)) div.classList.add('seleccionado');
        div.textContent = p.label;
        div.onclick = () => togglePuesto(idx);
        grid.appendChild(div);
    });
    actualizarTotal();
}

function togglePuesto(idx) {
    const p = puestos[idx];
    if (p.reservado) return;
    const i = seleccionados.indexOf(idx);
    if (i === -1) {
        seleccionados.push(idx);
    } else {
        seleccionados.splice(i, 1);
    }
    renderGrid();
    document.getElementById('btnReservar').disabled = seleccionados.length === 0;
}

function actualizarTotal() {
    document.getElementById('contador').textContent = seleccionados.length;
    document.getElementById('total').textContent = (seleccionados.length * PRECIO).toLocaleString('es-CO');
}

function generarTicketComprador(nombre, telefono, puestosSel, total) {
    const lista = puestosSel.map(idx => puestos[idx].label).join(', ');
    return '🧾 CONFIRMACIÓN DE COMPRA\n═══════════════════════════════════════\n🎟️ Rifa: ' + CONFIG.rifa + '\n🏆 Premio: ' + CONFIG.premio + '\n📦 Artículo: ' + CONFIG.articulo + '\n───────────────────────────────────────\n📦 Puestos: ' + lista + '\n💰 Total: $' + total.toLocaleString('es-CO') + '\n───────────────────────────────────────\n👤 Comprador: ' + nombre + '\n📱 Teléfono: ' + telefono + '\n📅 ' + new Date().toLocaleString('es-CO') + '\n═══════════════════════════════════════\n✅ Guarda este ticket como comprobante';
}

function generarTicketAdmin(nombre, telefono, puestosSel, total) {
    const lista = puestosSel.map(idx => puestos[idx].label).join(', ');
    return '📦 NUEVA COMPRA - RIFA ' + CONFIG.rifa + '\n═══════════════════════════════════════\n🎟️ Puestos: ' + lista + '\n💰 Total: $' + total.toLocaleString('es-CO') + '\n📦 Artículo: ' + CONFIG.articulo + '\n───────────────────────────────────────\n👤 Comprador: ' + nombre + '\n📱 Teléfono: ' + telefono + '\n📅 ' + new Date().toLocaleString('es-CO') + '\n═══════════════════════════════════════\n✅ Ticket enviado al comprador';
}

function enviarTickets() {
    const nombre = document.getElementById('nombre').value.trim();
    const telefono = document.getElementById('telefono').value.trim();

    if (!nombre || !telefono || telefono.length < 10) {
        alert('⚠️ Completa nombre y teléfono válido');
        return;
    }

    if (seleccionados.length === 0) {
        alert('⚠️ Selecciona al menos un puesto');
        return;
    }

    const total = seleccionados.length * PRECIO;

    const ticketComprador = generarTicketComprador(nombre, telefono, seleccionados, total);
    const ticketAdmin = generarTicketAdmin(nombre, telefono, seleccionados, total);

    seleccionados.forEach(idx => {
        puestos[idx].reservado = true;
        puestos[idx].comprador = nombre;
    });
// Enviar al comprador
window.open(`whatsapp://send?phone=57${telefono}&text=${encodeURIComponent(ticketComprador)}`, '_blank');

// Enviar al admin
window.open(`whatsapp://send?phone=57${ADMIN}&text=${encodeURIComponent(ticketAdmin)}`, '_blank');

    seleccionados = [];
    renderGrid();
    document.getElementById('btnReservar').disabled = true;

    alert('✅ Tickets enviados a tu WhatsApp y al administrador');
}

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('btnIrGrilla').onclick = () => mostrarPantalla('pantalla2');
    document.getElementById('btnVolverInicio').onclick = () => mostrarPantalla('pantalla1');
    document.getElementById('btnReservar').onclick = enviarTickets;

    if (CONFIG.logo) {
        document.getElementById('titulo').innerHTML = '<img src="' + CONFIG.logo + '" class="logo-img"> ' + CONFIG.titulo;
    }
    document.getElementById('info').textContent = 'Rifa: ' + CONFIG.rifa + ' | Premio: ' + CONFIG.premio + ' | Artículo: ' + CONFIG.articulo + ' | Valor puesto: $' + CONFIG.precio.toLocaleString('es-CO');
    if (CONFIG.imagenArticulo) {
        document.getElementById('articuloContainer').innerHTML = '<img src="' + CONFIG.imagenArticulo + '" class="articulo-img" alt="Artículo">';
    }

    initPuestos();
    renderGrid();
});
</script>
<!-- ============================================================
     🔒 PANEL DE ADMINISTRACIÓN (SOLO CON CÓDIGO)
============================================================ -->
<div id="panelAdmin" style="display:none; background:#1a1a2e; padding:20px; border-radius:10px; margin-top:20px; border:2px solid #ffcc00;">
    <h3 style="color:#ffcc00;">🔒 PANEL DE ADMINISTRACIÓN</h3>
    <p style="color:#aaa;">Cambia todo desde aquí (solo con código 8682)</p>
    
    <div style="margin:10px 0;">
        <label style="color:#fff;">📝 Título:</label>
        <input type="text" id="inputTitulo" value="🏆 yogurinazo" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0d0d1a; color:#fff;">
    </div>
    
    <div style="margin:10px 0;">
        <label style="color:#fff;">🎟️ Nombre de la rifa:</label>
        <input type="text" id="inputRifa" value="CHONTICO" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0d0d1a; color:#fff;">
    </div>
    
    <div style="margin:10px 0;">
        <label style="color:#fff;">🏆 Premio:</label>
        <input type="text" id="inputPremio" value="un paquete de yogurin de 47 unidades" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0d0d1a; color:#fff;">
    </div>
    
    <div style="margin:10px 0;">
        <label style="color:#fff;">💰 Precio:</label>
        <input type="number" id="inputPrecio" value="50000" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0d0d1a; color:#fff;">
    </div>
    
    <div style="margin:10px 0;">
        <label style="color:#fff;">📦 Artículo:</label>
        <input type="text" id="inputArticulo" value="BOLI YOGURT P47" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0d0d1a; color:#fff;">
    </div>
    
    <div style="margin:10px 0;">
        <label style="color:#fff;">🖼️ Logo (URL):</label>
        <input type="text" id="inputLogo" value="" placeholder="Pega la URL de tu logo" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0d0d1a; color:#fff;">
    </div>
    
    <div style="margin:10px 0;">
        <label style="color:#fff;">📸 Foto del artículo (URL):</label>
        <input type="text" id="inputFoto" value="" placeholder="Pega la URL de la foto" style="width:100%; padding:8px; border-radius:6px; border:none; background:#0d0d1a; color:#fff;">
    </div>
    
    <button onclick="guardarConfiguracion()" style="background:#00f5ff; color:#000; padding:12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; width:100%; margin-top:10px;">
        💾 GUARDAR CAMBIOS
    </button>
    
    <button onclick="cerrarPanel()" style="background:#ff0040; color:#fff; padding:10px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; width:100%; margin-top:10px;">
        ❌ CERRAR PANEL
    </button>
</div>

<!-- ============================================================
     BOTÓN PARA ABRIR EL PANEL (SOLO CON CÓDIGO)
============================================================ -->
<div style="text-align:center; margin:20px 0;">
    <button onclick="abrirPanelAdmin()" style="background:#ffcc00; color:#000; padding:12px 24px; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">
        🔒 ADMIN (solo con código)
    </button>
</div>
</body>
</html>
