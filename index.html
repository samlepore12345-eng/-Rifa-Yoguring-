<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUINIENTAZO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #0f0; font-family: Arial, sans-serif; }
    .hidden { display: none !important; }
    .pin { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; }
    h1 { color: #ffd700; font-size: 48px; text-align: center; }
    h2 { color: #ffd700; font-size: 28px; margin: 20px 0; }
    input { padding: 12px; background: #1a1a1a; border: 2px solid #0f0; color: #0f0; border-radius: 4px; width: 250px; font-size: 14px; }
    button { padding: 12px 24px; background: #ffd700; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 14px; margin: 5px; }
    button:hover { background: #ffed4e; }
    .admin { background: #000; padding: 30px; max-width: 1000px; margin: 0 auto; }
    .box { background: #1a1a1a; border: 2px solid #0f0; padding: 15px; margin: 15px 0; border-radius: 4px; }
    label { display: block; color: #0f0; font-size: 12px; margin-bottom: 8px; font-weight: bold; }
    input.full { width: 100%; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 20px 0; }
    .gridBtn { padding: 10px; background: #1a1a1a; border: 2px solid #0f0; color: #0f0; font-size: 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .gridBtn:disabled { background: #666; color: #999; opacity: 0.5; cursor: not-allowed; }
    .gridBtn.selected { background: #0f0; color: #000; }
    .public { background: #000; padding: 20px; min-height: 100vh; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
    .stat-box { background: #1a1a1a; border: 2px solid #0f0; padding: 20px; border-radius: 4px; text-align: center; }
    .stat-box h3 { color: #ffd700; font-size: 24px; }
    .stat-box p { color: #0f0; margin: 10px 0; }
    .nav { display: flex; justify-content: space-between; margin: 20px 0; }
    .foto-preview { width: 100%; max-height: 250px; border: 2px solid #0f0; border-radius: 4px; margin: 10px 0; display: none; }
    .foto-preview.show { display: block; }
  </style>
</head>
<body>

<div id="pin" class="pin">
  <h1>🔐 QUINIENTAZO</h1>
  <input type="password" id="pinInput" placeholder="PIN" onkeypress="if(event.key=='Enter') login()">
  <button onclick="login()">ENTRAR</button>
  <button onclick="goPublic()">Ver Pública</button>
</div>

<div id="admin" class="admin hidden">
  <div class="nav">
    <h1>⚙️ ADMIN</h1>
    <button onclick="logout()" style="background:#ff3333">← Salir</button>
  </div>

  <div class="box">
    <label>📷 Foto del Artículo:</label>
    <img id="fotoPreview" class="foto-preview">
    <button onclick="openCamera()">📷 Cámara</button>
    <button onclick="clearFoto()" style="background:#ff3333">✕ Limpiar</button>
  </div>

  <div class="box">
    <label>🔗 URL Foto (Google, Facebook, etc):</label>
    <input type="text" id="urlFoto" class="full" placeholder="https://ejemplo.com/foto.jpg" oninput="loadFotoURL()">
  </div>

  <div class="box">
    <label>Chontico Noche (últimos 2 dígitos):</label>
    <input type="text" id="chontico" class="full" maxlength="2" oninput="saveConfig()">
  </div>

  <div class="box">
    <label>Nombre Ganador:</label>
    <input type="text" id="ganador" class="full" oninput="saveConfig()">
  </div>

  <div class="box">
    <label>Puestos Vendidos:</label>
    <p id="porcentaje" style="color:#ffd700; font-size:20px;">0%</p>
  </div>
</div>

<div id="public" class="public hidden">
  <div class="nav">
    <h1>🦅 QUINIENTAZO</h1>
    <button onclick="goBack()" style="background:#ffd700">← Atrás</button>
  </div>

  <div id="fotoPublic" style="text-align:center; margin: 20px 0;">
    <img id="pubFoto" style="max-width: 100%; max-height: 300px; border: 2px solid #0f0; border-radius: 4px; display: none;">
  </div>

  <div class="stats">
    <div class="stat-box">
      <h3>Puestos</h3>
      <p id="pubVendidos">0</p>
      <p id="pubPorcentaje">0%</p>
    </div>
    <div class="stat-box">
      <h3>Chontico</h3>
      <p id="pubChontico">-</p>
      <p>Últimos 2 dígitos</p>
    </div>
  </div>

  <h2>Elige tus Números</h2>
  <div class="grid" id="grid"></div>
  <div style="text-align: center; margin-top: 30px; color: #999; font-size: 12px;">
    <p>Lácteos Yoguring • 27 años</p>
  </div>
</div>

<script>
const PIN = '1234';
let config = { chontico: '', ganador: '', foto: '' };
let puestos = Array(50).fill(false);
let selectedNumbers = [];

function loadConfig() {
  const saved = localStorage.getItem('config');
  if (saved) config = JSON.parse(saved);
  const savedPuestos = localStorage.getItem('p');
  if (savedPuestos) puestos = JSON.parse(savedPuestos);
}

function saveConfig() {
  config.chontico = document.getElementById('chontico').value;
  config.ganador = document.getElementById('ganador').value;
  localStorage.setItem('config', JSON.stringify(config));
  updateUI();
}

function saveFoto(dataUrl) {
  config.foto = dataUrl;
  localStorage.setItem('config', JSON.stringify(config));
}

function openCamera() {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      const video = document.createElement('video');
      video.srcObject = stream;
      video.play();
      const canvas = document.createElement('canvas');
      const captureBtn = document.createElement('button');
      captureBtn.textContent = '📸 Capturar';
      captureBtn.onclick = () => {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const dataUrl = canvas.toDataURL('image/jpeg');
        document.getElementById('fotoPreview').src = dataUrl;
        document.getElementById('fotoPreview').classList.add('show');
        document.getElementById('urlFoto').value = '';
        saveFoto(dataUrl);
        stream.getTracks().forEach(t => t.stop());
      };
      alert('Cámara abierta. Haz clic en el botón para capturar.');
    })
    .catch(e => alert('No se pudo acceder a la cámara: ' + e.message));
}

function loadFotoURL() {
  const url = document.getElementById('urlFoto').value.trim();
  if (url) {
    document.getElementById('fotoPreview').src = url;
    document.getElementById('fotoPreview').classList.add('show');
    config.foto = url;
    saveFoto(url);
  }
}

function clearFoto() {
  document.getElementById('fotoPreview').src = '';
  document.getElementById('fotoPreview').classList.remove('show');
  document.getElementById('urlFoto').value = '';
  config.foto = '';
  localStorage.setItem('config', JSON.stringify(config));
}

function login() {
  if (document.getElementById('pinInput').value === PIN) {
    document.getElementById('pin').classList.add('hidden');
    document.getElementById('admin').classList.remove('hidden');
    loadConfig();
    document.getElementById('chontico').value = config.chontico;
    document.getElementById('ganador').value = config.ganador;
    document.getElementById('urlFoto').value = '';
    if (config.foto) {
      document.getElementById('fotoPreview').src = config.foto;
      document.getElementById('fotoPreview').classList.add('show');
    }
    updateUI();
  } else {
    alert('PIN incorrecto');
  }
}

function logout() {
  document.getElementById('admin').classList.add('hidden');
  document.getElementById('pin').classList.remove('hidden');
  document.getElementById('pinInput').value = '';
}

function goPublic() {
  document.getElementById('pin').classList.add('hidden');
  document.getElementById('public').classList.remove('hidden');
  loadConfig();
  if (config.foto) {
    document.getElementById('pubFoto').src = config.foto;
    document.getElementById('pubFoto').style.display = 'block';
  }
  buildGrid();
}

function goBack() {
  document.getElementById('public').classList.add('hidden');
  document.getElementById('pin').classList.remove('hidden');
}

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < 50; i++) {
    const btn = document.createElement('button');
    btn.className = 'gridBtn';
    btn.textContent = String(i * 2).padStart(2, '0') + '-' + String(i * 2 + 1).padStart(2, '0');
    if (puestos[i]) {
      btn.disabled = true;
    } else {
      btn.onclick = () => selectNumber(i, btn);
    }
    grid.appendChild(btn);
  }
  document.getElementById('pubVendidos').textContent = puestos.filter(p => p).length;
  document.getElementById('pubPorcentaje').textContent = Math.round((puestos.filter(p => p).length / 50) * 100) + '%';
  document.getElementById('pubChontico').textContent = config.chontico || '-';
}

function selectNumber(idx, btn) {
  if (selectedNumbers.includes(idx)) {
    selectedNumbers = selectedNumbers.filter(i => i !== idx);
    btn.classList.remove('selected');
  } else {
    selectedNumbers.push(idx);
    btn.classList.add('selected');
  }
}

function updateUI() {
  document.getElementById('porcentaje').textContent = Math.round((puestos.filter(p => p).length / 50) * 100) + '%';
}

loadConfig();
</script>

</body>
</html>
